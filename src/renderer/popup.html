<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="styles.css"><style>
html,body{ background:transparent; }
body{ background:var(--pill); background-image:var(--pill-grad); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow), inset 0 1px 0 var(--hl); margin:0; }
#pop{ display:flex; align-items:center; gap:10px; padding:0 18px; height:64px; font-size:13px; }
#pop .ico{ display:flex; align-items:center; color:var(--fg); }
#pop .ico .oi-ic{ width:20px; height:20px; }
#pop .txt{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pop .sub{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style></head><body>
<script src="icons.js"></script>
<div id="pop"><span class="ico" id="ico"></span><span class="txt" id="txt"></span><span class="sub" id="sub"></span></div>
<script>
window.openisland.on('popup-show', (p) => {
  // Icon is a name from the shared OIIcons set (never an emoji): 'battery',
  // 'headphones', 'scissors', 'volume', 'sun', 'info', ...
  var name = (p && p.icon) || 'info';
  var el = document.getElementById('ico');
  el.innerHTML = (window.OIIcons && window.OIIcons.icon) ? window.OIIcons.icon(name, 'oi-ic') : '';
  document.getElementById('txt').textContent = (p && p.text) || '';
  document.getElementById('sub').textContent = (p && p.sub) || '';
});
</script></body></html>
